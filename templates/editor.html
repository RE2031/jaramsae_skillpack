<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자람새 | 게시물 편집</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#223344;font:15px/1.55 system-ui,"Noto Sans CJK KR",sans-serif}header.top{position:sticky;top:0;z-index:12;background:#fff;border-bottom:1px solid #dce2e8;padding:16px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:20px;font-weight:800;letter-spacing:-1px}.muted{color:#667482;font-size:13px}.spacer{flex:1}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccd5dd;background:white;color:#223344;padding:8px 13px;border-radius:7px;font-weight:600}button.primary{background:#29495f;color:white;border-color:#29495f}button:focus-visible{outline:3px solid #92c8ed}main{max-width:1550px;margin:auto;padding:26px 28px 60px}h1{font-size:27px;letter-spacing:-1px;margin:0 0 4px}h2{font-size:18px;margin:0}.version{background:#fff;border:1px solid #dce2e8;border-radius:12px;padding:18px;margin-top:18px}.version.chosen{border:2px solid #488ab3;padding:17px}.version-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.version-head .pick{margin-left:auto}.scroll{overflow-x:auto;padding-bottom:4px}.four{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;min-width:768px}.cell{min-width:0}.canvas{width:100%;aspect-ratio:4/5;overflow:hidden;background:#e5e9ec;position:relative;cursor:pointer;outline:1px solid #e2e5e9}.canvas:hover,.canvas.active{outline:2px solid #488ab3}.stage{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:top left;font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif}.cellbar{display:flex;align-items:center;justify-content:space-between;padding-top:8px;font-size:12px;color:#687684}.cellbar button{padding:4px 9px;font-size:12px}.panel{position:fixed;inset:var(--top-height,75px) 0 0 auto;width:min(420px,100%);background:#fff;z-index:10;border-left:1px solid #dce2e8;box-shadow:-6px 0 28px #11223322;overflow:auto;padding:20px;display:none}.panel.open{display:block}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.field{display:block;margin:14px 0 0;font-size:13px;font-weight:650}.field input:not([type=range]),.field textarea{display:block;width:100%;padding:8px;border:1px solid #cbd5dd;border-radius:6px;margin-top:5px;background:white}.field textarea{resize:vertical;min-height:62px}.field input[type=range]{display:block;width:100%;margin-top:6px}.notice{background:#f0f5f8;padding:10px 12px;border-radius:6px;color:#405a6a;font-size:12px;margin-top:14px}.panel .canvas{max-width:230px;margin:15px auto}.panel .stage{pointer-events:none}#status{margin:6px 0;color:#385c70;font-size:13px}body.editing main{margin-right:min(420px,35vw)}@media(max-width:900px){body.editing main{margin-right:0}main{padding:18px 12px}header.top{padding:12px}.panel{width:min(420px,100%)}}
</style></head><body><header class="top"><div class="logo">자람새 · 게시물 편집</div><span class="muted" id="chosenLabel"></span><span class="spacer"></span><button id="saveProject">편집 프로젝트 저장</button><button id="saveSelected">선택안 HTML 저장</button><button id="exportMedia" class="primary" hidden>선택안 PNG·MP4 저장</button></header><main><h1>시안 선택 및 편집</h1><div class="muted">사진 또는 편집 버튼을 눌러 문구와 크롭을 수정하세요. 여러 시안이 있다면 저장할 본문 스타일을 선택하세요.</div><div id="status" role="status"></div><div id="versions"></div></main><aside id="panel" class="panel" aria-label="슬라이드 편집"><div class="panelhead"><h2 id="editTitle">슬라이드 편집</h2><button id="closePanel">닫기</button></div><div id="bigPreview"></div><div id="fields"></div><div class="notice" id="warning">수정 내용은 즉시 미리보기에 반영됩니다. 편집을 이어가려면 프로젝트 저장 버튼으로 HTML을 저장하세요.</div><button id="resetSlide" style="margin-top:14px">이 슬라이드 원래대로</button></aside><script id="project" type="application/json">__PROJECT__</script><script>
'use strict';
const $=s=>document.querySelector(s), project=JSON.parse($('#project').textContent), versions=project.versions;let selected=project.selected||0,active=null;const requested=versions.findIndex(v=>v.id&&'#'+v.id===location.hash);if(requested>=0)selected=requested;const originals=versions.map(v=>v.slides.slice());
const status=s=>$('#status').textContent=s;new ResizeObserver(()=>document.documentElement.style.setProperty('--top-height',$('.top').offsetHeight+'px')).observe($('.top'));
const parse=s=>{const t=document.createElement('template');t.innerHTML=s;return t.content.firstElementChild};
function preview(v,i,holder){holder.replaceChildren();const stage=document.createElement('div');stage.className='stage';holder.append(stage);const root=stage.attachShadow({mode:'open'});const style=document.createElement('style');style.textContent=versions[v].css+'\n:host{display:block;width:1080px;height:1350px;font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif}';root.append(style,parse(versions[v].slides[i]));const resize=()=>stage.style.transform=`scale(${holder.clientWidth/1080})`;resize();const observer=new ResizeObserver(resize);observer.observe(holder);return observer;}
let observers=[];function draw(){observers.forEach(o=>o.disconnect());observers=[];const host=$('#versions');host.replaceChildren();versions.forEach((v,vi)=>{const section=document.createElement('section');section.className='version'+(vi===selected?' chosen':'');const head=document.createElement('div');head.className='version-head';const title=document.createElement('h2');title.textContent=v.name;const note=document.createElement('span');note.className='muted';note.textContent=v.description||'';const choose=document.createElement('button');choose.className='pick'+(vi===selected?' primary':'');choose.textContent=vi===selected?'✓ 선택됨':'이 시안 선택';choose.onclick=()=>{selected=vi;draw();status(v.name+' 선택 완료')};head.append(title,note,choose);section.append(head);const sc=document.createElement('div');sc.className='scroll';const grid=document.createElement('div');grid.className='four';v.slides.forEach((_,i)=>{const cell=document.createElement('div');cell.className='cell';const canvas=document.createElement('div');canvas.className='canvas';canvas.id=`canvas-${vi}-${i}`;canvas.onclick=()=>openEditor(vi,i);const bar=document.createElement('div');bar.className='cellbar';const lab=document.createElement('span');lab.textContent=`0${i+1} · ${i===0?'표지':'본문'}`;const edit=document.createElement('button');edit.textContent='편집';edit.onclick=()=>openEditor(vi,i);bar.append(lab,edit);
if(parse(v.slides[i]).querySelector('video')){
  const play=document.createElement('button');play.textContent='재생';
  play.onclick=async()=>{
    const root=canvas.querySelector('.stage').shadowRoot;
    const card=root.querySelector('.slide');
    const clip=card.querySelector('video');
    if(!clip.paused){clip.pause();play.textContent='재생';return;}
    card.classList.add('is-playing');
    clip.onended=()=>{card.classList.remove('is-playing');play.textContent='재생';};
    try{await clip.play();play.textContent='일시정지';}catch(error){card.classList.remove('is-playing');status(error.message);}
  };
  bar.append(play);
}cell.append(canvas,bar);grid.append(cell);});sc.append(grid);section.append(sc);host.append(section);v.slides.forEach((_,i)=>observers.push(preview(vi,i,$(`#canvas-${vi}-${i}`))));});$('#chosenLabel').textContent=versions[selected].name+' 선택 중';}
let panelObserver=null;function updatePreview(){if(!active)return;const [v,i]=active;const holder=$(`#canvas-${v}-${i}`);if(holder){holder._resizeObserver?.disconnect();holder._resizeObserver=preview(v,i,holder);observers.push(holder._resizeObserver);}if(panelObserver)panelObserver.disconnect();panelObserver=preview(v,i,$('#bigPreview'));}
function saveSlide(v,i,html){
  versions[v].slides[i]=html;
  if(i===0 && versions[v].id)versions.forEach(other=>other.slides[0]=html);
}
function change(fn){const [v,i]=active;const el=parse(versions[v].slides[i]);fn(el);saveSlide(v,i,el.outerHTML);updatePreview();}
function field(label,value,callback,kind='text',opts={}){const wrap=document.createElement('label');wrap.className='field';wrap.textContent=label;const el=document.createElement(kind==='textarea'?'textarea':'input');if(kind!=='textarea')el.type=kind;Object.assign(el,opts);if(kind!=='file')el.value=value;el.addEventListener(kind==='file'?'change':'input',()=>callback(kind==='file'?el.files[0]:el.value));wrap.append(el);$('#fields').append(wrap);return el;}
function openEditor(v,i){active=[v,i];$('#panel').classList.add('open');document.body.classList.add('editing');$('#editTitle').textContent=`${versions[v].name} · ${i+1}장`;$('#bigPreview').className='canvas';$('#fields').replaceChildren();const el=parse(versions[v].slides[i]);const cover=el.classList.contains('signature-cover');const specs=cover?[['표시 이름','.cover-brand'],['도입 문구','.cover-eyebrow'],['제목 첫 줄','h1 span:first-child'],['제목 둘째 줄','h1 span:nth-child(2)'],['사진 출처','.cover-credit']]:[['표시 이름','header span:first-child'],['표시 이름','.overlay-brand span'],['발행호','.issue'],['인터뷰 질문','.interview-question span'],['도입 문구','.category'],['제목','h1'],['본문','p'],['사진 속 한마디','.photo-aside'],['영상 자막','.video-subtitle'],['사진 출처','footer span:last-child']];for(const [label,selector] of specs){const node=el.querySelector(selector);if(!node)continue;field(label,node.textContent,s=>change(a=>a.querySelector(selector).textContent=s),!cover&&['h1','p','.video-subtitle'].includes(selector)?'textarea':'text');}const title=el.querySelector('h1');if(title){const fallback=cover?94:65;field('제목 글자 크기',parseFloat(title.style.fontSize)||fallback,s=>change(a=>a.querySelector('h1').style.setProperty('font-size',s+'px','important')),'range',{min:40,max:120,step:1});}const img=el.querySelector('.art img');if(img){field('사진 교체','',file=>{if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){status('JPG, PNG, WebP 사진만 선택하세요.');return;}const reader=new FileReader();reader.onload=()=>{const a=parse(versions[v].slides[i]);a.querySelector('.art img').src=reader.result;saveSlide(v,i,a.outerHTML);if(active&&active[0]===v&&active[1]===i)updatePreview();else draw();};reader.readAsDataURL(file);},'file',{accept:'image/jpeg,image/png,image/webp'});const p=img.style.objectPosition.match(/([\d.]+)%\s+([\d.]+)%/);let x=p?+p[1]:50,y=p?+p[2]:50,z=+(img.style.transform.match(/scale\(([^)]+)\)/)||[0,1])[1];const crop=()=>change(a=>{const im=a.querySelector('.art img');im.style.setProperty('object-position',`${x}% ${y}%`,'important');im.style.transformOrigin=`${x}% ${y}%`;im.style.transform=`scale(${z})`;});field('사진 가로 위치',x,s=>{x=+s;crop()},'range',{min:0,max:100});field('사진 세로 위치',y,s=>{y=+s;crop()},'range',{min:0,max:100});field('사진 확대',z,s=>{z=+s;crop()},'range',{min:1,max:2.5,step:0.05});}updatePreview();}
$('#closePanel').onclick=()=>{$('#panel').classList.remove('open');document.body.classList.remove('editing');if(panelObserver)panelObserver.disconnect();active=null;};$('#resetSlide').onclick=()=>{if(!active)return;const [v,i]=active;saveSlide(v,i,originals[v][i]);openEditor(v,i);};
function download(name,content){const url=URL.createObjectURL(new Blob([content],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function safeJSON(o){return JSON.stringify(o).replace(/</g,'\\u003c');}
$('#saveProject').onclick=()=>{project.selected=selected;const doc=document.documentElement.cloneNode(true);doc.querySelector('#project').textContent=safeJSON({...project,exportUrl:null});doc.querySelector('#versions').replaceChildren();doc.querySelector('#fields').replaceChildren();doc.querySelector('#bigPreview').replaceChildren();doc.querySelector('#panel').classList.remove('open');doc.querySelector('body').classList.remove('editing');download('jaramsae-editable-project.html','<!doctype html>'+doc.outerHTML);status('편집 프로젝트 HTML을 저장했습니다. 다시 열면 수정 내용을 이어서 편집할 수 있습니다.');};
$('#saveSelected').onclick=()=>{
  const v=versions[selected];
  download('jaramsae-selected-version-'+(selected+1)+'.html','<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>자람새 선택안</title><style>'+v.css+'</style></head><body>'+v.slides.join('')+'</body></html>');
  status('선택안 HTML을 저장했습니다.');
};
const exportButton=$('#exportMedia');
exportButton.hidden=!project.exportUrl || location.protocol==='file:';
exportButton.onclick=async()=>{
  const v=versions[selected];
  const selectors=['.cover-brand','.cover-eyebrow','h1 span:first-child','h1 span:nth-child(2)',
    '.cover-credit','.category','h1','p','footer span:last-child','.photo-aside',
    '.video-subtitle','header span:first-child','.overlay-brand span','.issue','.interview-question span'];
  const edits=v.slides.map((html,i)=>{
    const card=parse(html);
    const old=parse(originals[selected][i]);
    const text={};
    for(const selector of selectors){
      const node=card.querySelector(selector);
      if(node && node.textContent!==old.querySelector(selector)?.textContent)text[selector]=node.textContent;
    }
    const photo=card.querySelector('.art img');
    const oldPhoto=old.querySelector('.art img');
    const image={};
    if(photo && oldPhoto){
      if(photo.getAttribute('src')!==oldPhoto.getAttribute('src'))image.src=photo.getAttribute('src');
      if(photo.style.objectPosition!==oldPhoto.style.objectPosition){
        const position=photo.style.objectPosition.match(/([\d.]+)%\s+([\d.]+)%/);
        if(position){image.x=+position[1];image.y=+position[2];}
      }
      if(photo.style.transform!==oldPhoto.style.transform)image.zoom=Number(photo.style.transform.match(/scale\(([^)]+)\)/)?.[1]);
    }
    return {text,image,size:parseFloat(card.querySelector('h1').style.fontSize)||null};
  });
  exportButton.disabled=true;
  status('편집 내용을 반영해 저장 중…');
  try{
    const response=await fetch(project.exportUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edition:v.id,edits})});
    const result=await response.json();
    if(!result.ok)throw new Error(result.error);
    status('저장됨 · '+result.folder+' ');
    for(const path of result.files){
      const link=document.createElement('a');link.href=path;link.download='';link.textContent=path.split('/').pop();
      $('#status').append(link,' ');
    }
  }catch(error){status(error.message);}
  finally{exportButton.disabled=false;}
};
draw();
</script></body></html>
